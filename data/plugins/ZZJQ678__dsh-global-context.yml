url: https://github.com/ZZJQ678/dsh-global-context
name: ZZJQ678/dsh-global-context
category: session
description:
  en: 'Global context for DeepSeek Harness: injects a custom prompt at the top of every session system prompt, and adds a Global Context tab in the conversation view where you can edit it live — saved changes apply to the next message without a restart.'
  zh: '全局上下文：把自定义提示词注入到每个会话系统提示词的最顶部，并在对话视图新增「全局上下文配置」标签页随时编辑，保存后下一条消息即生效、无需重启。'
